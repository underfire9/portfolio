      <p class="bio">2001 年為架設遊戲網站自學而開啟設計職涯，經歷過 Soho、小公司、大公司、再回到資訊服務，負責過大型專案 KKTIX 使用者前後台介面設計、Prototype，擅長分析複雜結構、流程的系統介面，熱愛效果精緻或華麗的特效網站。</p>
      <nav class="doors" aria-label="作品集">
        <a class="door" href="#works"><span class="door-label">作品</span><span class="door-count" data-count="ai"></span></a>
        <a class="door" href="#handmade"><span class="door-label">手工年代</span><span class="door-count" data-count="handmade"></span></a>
      </nav>
    </div>
  </div>
  <footer class="hero-foot contact">
    <span class="mail"><a href="mailto:underfire9@gmail.com">underfire9 a gmail.com</a><button type="button" class="copy" data-copy="underfire9@gmail.com" aria-label="複製 email" title="複製"><svg class="ic-copy" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/></svg><svg class="ic-done" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button></span>

<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tron City 3D</title>
<meta name="description" content="非官方粉絲作品：電影《創：光速戰記》The Grid 裡的 Tron City 互動 3D 模型">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Noto+Sans+TC:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D viewport; HUD floats at the edges like a program's display. Single dark look by choice. */
:root {
  --void: #02050a;
  --ink: #d8f6ff;
  --dim: #7aa3b3;
  --cyan: #58e1ff;
  --white: #f4fbff;
  --clu: #ff8a2a;
  --amber: #ffcc66;
  --hud: rgba(4, 14, 22, 0.72);
  --hud-line: rgba(88, 225, 255, 0.35);
  --f-display: "Michroma", "Eurostile", "Arial Black", sans-serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--void); color: var(--ink); font-family: var(--f-body); overflow: hidden; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; }
#labels { position: fixed; inset: 0; pointer-events: none; }

.hud { position: fixed; z-index: 5; display: flex; flex-direction: column; gap: 8px; }
.hud-top { top: calc(12px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); flex-direction: row; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; pointer-events: none; }
.hud-top > * { pointer-events: auto; }
/* title block: the name sets the width; the line under it and the live camera readout are spread to the same width */
.brand { display: inline-grid; justify-items: stretch; gap: 6px; padding: 8px 0; position: relative; }
.brand h1 { margin: 0; font: 400 clamp(18px, 2.4vw, 30px)/1.1 var(--f-display); letter-spacing: .2em; margin-right: -.2em; color: var(--white); text-shadow: 0 0 12px rgba(88,225,255,.8), 0 0 2px #fff; white-space: nowrap; }
.brand p { margin: 0; display: flex; align-items: center; justify-content: space-between; gap: 10px; white-space: nowrap; }
.brand .sub { font: 500 10px/1 var(--f-mono); letter-spacing: .12em; color: var(--ink); }
.brand .sub i { flex: 1; height: 1px; min-width: 12px; background: linear-gradient(90deg, rgba(88,225,255,.15), var(--cyan), rgba(88,225,255,.15)); }
.brand .sub span:last-child { color: var(--cyan); }
.brand .tele { font: 400 9px/1 var(--f-mono); letter-spacing: .08em; color: var(--dim); font-variant-numeric: tabular-nums; padding-top: 6px; border-top: 1px solid rgba(88,225,255,.14); }
.brand .tele b { font-weight: 500; color: var(--ink); }

/* control console: the title block's counterpart on the right, bottom edges aligned. Hairline dividers between groups,
   the same small mono line for the group names; keys are bare glyphs and words that light up like the title when on */
.console { display: flex; align-items: stretch; justify-content: flex-end; padding: 8px 0; position: relative; }
.grp:last-child { padding-right: 0; }
.seg button.god { padding: 7px 5px 9px; opacity: .45; }
.seg button.god svg { width: 12px; height: 12px; }
.seg button.god:hover, .seg button.god[aria-pressed="true"] { opacity: 1; }
.grp { display: grid; grid-template-rows: 1fr auto; gap: 6px; padding: 0 10px; }
.grp + .grp { border-left: 1px solid rgba(88,225,255,.14); }
.seg { display: flex; gap: 2px; align-items: center; }
.gl { order: 2; font: 400 9px/1 var(--f-mono); letter-spacing: .08em; color: var(--dim); padding: 6px 6px 0; border-top: 1px solid rgba(88,225,255,.14); white-space: nowrap; }
.seg button { background: none; border: 0; clip-path: none; backdrop-filter: none; box-shadow: none; display: flex; align-items: center; gap: 7px; padding: 7px 8px 9px; position: relative;
  font: 500 12px/1 var(--f-body); letter-spacing: .12em; color: var(--dim); text-shadow: 0 0 4px #000; white-space: nowrap; }
.seg button svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.2; stroke-linejoin: round; stroke-linecap: round; flex: none; }
.seg button::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: 2px; height: 1px; background: var(--cyan); box-shadow: 0 0 6px var(--cyan); transform: scaleX(0); transition: transform .25s ease; }
.seg button:hover { color: var(--ink); background: none; }
.seg button[aria-pressed="true"] { color: var(--white); background: none; box-shadow: none; text-shadow: 0 0 10px rgba(88,225,255,.8), 0 0 2px #fff; }
.seg button[aria-pressed="true"] svg { color: var(--cyan); filter: drop-shadow(0 0 3px var(--cyan)); }
.seg button[aria-pressed="true"]::after { transform: scaleX(1); }
.seg button:focus-visible { outline: 1px solid var(--cyan); outline-offset: 0; }
@media (prefers-reduced-motion: reduce) { .seg button::after { transition: none; } }
button { font: 500 12px/1 var(--f-body); color: var(--ink); background: var(--hud); border: 1px solid var(--hud-line); padding: 9px 12px; cursor: pointer; letter-spacing: .04em; backdrop-filter: blur(6px); clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px); }
button:hover { border-color: var(--cyan); color: var(--white); }
button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
button[aria-pressed="true"] { background: rgba(88,225,255,.18); border-color: var(--cyan); color: var(--white); box-shadow: inset 0 0 12px rgba(88,225,255,.35); }

.panel { position: fixed; z-index: 6; top: calc(92px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: min(340px, calc(100% - 32px)); max-height: calc(100% - 190px); overflow-y: auto; background: var(--hud); border: 1px solid var(--hud-line); padding: 16px; backdrop-filter: blur(8px); font-size: 13px; line-height: 1.6; }
.panel h2 { margin: 0 0 10px; font: 400 12px/1.3 var(--f-display); letter-spacing: .16em; color: var(--white); }
.panel h3 { margin: 14px 0 6px; font: 500 11px/1.3 var(--f-mono); letter-spacing: .12em; color: var(--cyan); text-transform: uppercase; }
.panel p { margin: 0; color: var(--dim); }
.sw { display: grid; grid-template-columns: 28px 1fr; gap: 6px 10px; align-items: center; }
.sw i { display: block; height: 4px; border-radius: 2px; }
.sw span { color: var(--ink); }
.sw em { font-style: normal; color: var(--dim); font-size: 12px; }
dl.scale { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; font-family: var(--f-mono); font-size: 12px; font-variant-numeric: tabular-nums; }
dl.scale dt { color: var(--dim); }
dl.scale dd { margin: 0; color: var(--ink); text-align: right; }

.lbl { font: 500 11px/1.25 var(--f-body); color: var(--ink); white-space: nowrap; text-align: center; transform: translateY(-14px); text-shadow: 0 0 6px #000, 0 0 2px #000; }
.lbl b { display: block; font: 400 10px/1.3 var(--f-display); letter-spacing: .14em; color: var(--white); text-shadow: 0 0 8px rgba(88,225,255,.9), 0 0 2px #000; }
.lbl.major b { font-size: 13px; }
.lbl.clu b { color: #ffd2a8; text-shadow: 0 0 8px rgba(255,138,42,.9), 0 0 2px #000; }
.lbl.amber b { color: #fff0c8; text-shadow: 0 0 8px rgba(255,204,102,.9), 0 0 2px #000; }
.lbl::after { content: ""; display: block; width: 1px; height: 12px; margin: 3px auto 0; background: linear-gradient(var(--cyan), transparent); }
.lbl.minor { opacity: .85; }
#labels.off { display: none; }
/* cinema mode: 2.39:1 letterbox bars slide in */
.bars::before, .bars::after { content: ""; position: fixed; left: 0; right: 0; z-index: 4; height: 0; background: #000; transition: height .8s cubic-bezier(.3,0,.2,1); pointer-events: none; }
.bars::before { top: 0; } .bars::after { bottom: 0; }
body.cine .bars::before, body.cine .bars::after { height: max(0px, calc((100vh - 100vw / 2.39) / 2)); }
@media (prefers-reduced-motion: reduce) { .bars::before, .bars::after { transition: none; } }
.vlist { display: grid; gap: 6px; margin-top: 12px; }
.vlist button { display: grid; gap: 4px; text-align: left; padding: 10px 12px; }
.vlist b { font: 500 13px/1.3 var(--f-body); color: var(--white); }
.vlist span { font: 400 11px/1.3 var(--f-mono); color: var(--dim); }
.note { position: fixed; z-index: 5; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); margin: 0; font: 400 11px/1.5 var(--f-body); color: var(--dim); text-shadow: 0 0 4px #000; pointer-events: none; }
.vlist .home { margin-top: 6px; border-style: dashed; }

#msg { position: fixed; inset: 0; display: grid; place-items: center; font: 400 13px/1.6 var(--f-mono); color: var(--dim); text-align: center; padding-inline: max(16px, env(safe-area-inset-left, 0px)); }

@media (max-width: 560px) {
  .brand p { display: none; }
  .hud-top { gap: 10px; align-items: center; }
  .console { padding: 0; }
  .grp { padding: 0 4px; }
  .gl, .seg .t { display: none; }
  .seg button { padding: 10px 9px; }
  .panel { top: auto; bottom: calc(52px + env(safe-area-inset-bottom, 0px)); max-height: 52%; }
  .note { font-size: 10px; }
  .note .hint { display: none; }
}
</style>
</head>
<body>


<div id="stage"></div>
<div id="labels"></div>
<div id="msg">正在建立 Tron City…</div>
<script>
  // if building the city fails, say so on the loader instead of leaving it waiting forever
  addEventListener('error', e => { const m = document.getElementById('msg'); if (m) m.textContent = '載入失敗：' + (e.message || e.error || '未知錯誤'); });
  addEventListener('unhandledrejection', e => { const m = document.getElementById('msg'); if (m) m.textContent = '載入失敗：' + (e.reason && e.reason.message || e.reason); });
</script>

<div class="hud hud-top">
  <div class="brand">
    <h1>TRON CITY</h1>
    <p class="sub"><span>THE GRID</span><i></i><span>TRON: LEGACY</span></p>
    <p class="tele" aria-hidden="true"><span>ALT <b id="r-alt">----</b> M</span><span>HDG <b id="r-hdg">---</b>°</span><span>RNG <b id="r-rng">-.--</b> KM</span></p>
  </div>
  <nav class="console" aria-label="控制">
    <div class="grp">
      <span class="gl">VIEW · 鏡頭</span>
      <div class="seg">
        <button id="t-spin" aria-pressed="false" title="自動環繞"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M12.4 1.6v2.9H9.5"/></svg><span class="t">環繞</span></button>
        <button id="t-cine" aria-pressed="false" title="電影畫幅"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="3.5" width="13" height="9"/><path d="M1.5 6h13M1.5 10h13M5 3.5v2.5M11 3.5v2.5M5 10v2.5M11 10v2.5"/></svg><span class="t">電影</span></button>
        <button id="t-god" class="god" aria-pressed="false" title="上帝視角" aria-label="上帝視角"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.2l6.2 11H1.8z"/><path d="M5.2 9.6Q8 6.8 10.8 9.6Q8 12.4 5.2 9.6z"/><circle cx="8" cy="9.6" r=".8"/></svg></button>
      </div>
    </div>
    <div class="grp">
      <span class="gl">LAYERS · 顯示</span>
      <div class="seg">
        <button id="t-labels" aria-pressed="true" title="顯示或隱藏標籤（L）"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2h6l6 6-6 6-6-6z"/><circle cx="5.2" cy="5.2" r="1"/></svg><span class="t">標籤</span></button>
        <button id="t-vehicles" aria-pressed="false" title="交通工具"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3.6" cy="10.5" r="2.4"/><circle cx="12.4" cy="10.5" r="2.4"/><path d="M3.6 10.5L7 6h4l1.4 4.5M6 6h-1.5"/></svg><span class="t">交通工具</span></button>
      </div>
    </div>
    <div class="grp">
      <span class="gl">AUDIO · 聲音</span>
      <div class="seg">
        <button id="t-sound" aria-pressed="false" title="聲音"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h2.5L8 3v10l-3.5-3H2z"/><path d="M10.5 5.5a3.5 3.5 0 0 1 0 5M12.5 3.5a6.3 6.3 0 0 1 0 9"/></svg><span class="t">聲音</span></button>
      </div>
    </div>
  </nav>
</div>

<aside id="vehicles" class="panel" hidden>
  <h2>VEHICLES · 交通工具</h2>
  <p>全部照真實比例製作，從遠處只看得到光點。點一下鏡頭就會跟著它移動，拖曳可以繞著它轉，滾輪可以調整距離；再點一次或按 Esc 就回到城市。</p>
  <div class="vlist">
    <button data-vehicle="cycle"><b>光速機車 Light Cycle</b><span>競技場頂層比賽，約 3.3 m</span></button>
    <button data-vehicle="sentry"><b>巡邏機車</b><span>Clu 的哨兵在街道巡邏</span></button>
    <button data-vehicle="recognizer"><b>Recognizer</b><span>Clu 的巡邏艦，在城市上空巡航，寬 21 m</span></button>
    <button id="home" class="home"><b>回到城市</b><span>鏡頭回到 Tron City 全景</span></button>
  </div>
</aside>

<div class="bars" aria-hidden="true"></div>

<p class="note">非官方粉絲作品 · 與 Disney 及電影製作團隊無關<span class="hint"> · 拖曳旋轉，右鍵或按住空白鍵拖曳平移，滾輪縮放</span></p>
